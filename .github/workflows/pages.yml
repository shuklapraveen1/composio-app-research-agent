name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The published site is regenerated from the committed corpus on every push, so
# the page and the dataset behind it can never drift apart.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Build the case study and exports
        run: |
          python -m composio_ops.cli.main --log-level WARNING registry load --source apps.json
          python -m composio_ops.cli.main --log-level WARNING pipeline run

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
