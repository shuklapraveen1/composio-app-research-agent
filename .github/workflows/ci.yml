name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip show click
          python -c "import click; print('CLICK VERSION:', click.__version__)"

      - name: Test
        run: python -m pytest -q

      - name: Run the pipeline
        run: |
          python -m composio_ops.cli.main --log-level WARNING registry load --source apps.json
          python -m composio_ops.cli.main --log-level WARNING pipeline run

      # The pipeline promises byte-identical artifacts for a given seed. A second
      # run that changes a tracked file breaks that promise, so CI should fail.
      - name: Check the run is reproducible
        run: |
          python -m composio_ops.cli.main --log-level ERROR pipeline run
          git diff --exit-code -- data site
